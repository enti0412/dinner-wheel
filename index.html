<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚餐转盘 - 专家版</title>
    <style>
        :root {
            --bg1: #f3f8ff; --bg2: #eefaf3; --card: #ffffff;
            --text: #1f2937; --muted: #6b7280; --primary: #2563eb;
            --primary-hover: #1d4ed8; --border: #e5e7eb;
            --shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text); font-family: sans-serif; padding: 20px;
        }
        .app { width: min(92vw, 500px); display: grid; gap: 14px; }
        .wheel-card, .add-card {
            background: var(--card); border-radius: 16px; padding: 20px;
            box-shadow: var(--shadow); text-align: center;
        }
        #wheelCanvas { max-width: 100%; height: auto; cursor: pointer; }
        .result-display {
            font-size: 24px; font-weight: bold; margin: 15px 0;
            min-height: 36px; color: var(--primary);
        }
        .input-row { display: flex; gap: 8px; margin-top: 10px; }
        input {
            flex: 1; padding: 10px; border: 1px solid var(--border);
            border-radius: 8px; outline: none;
        }
        button {
            padding: 10px 20px; border-radius: 8px; border: none;
            cursor: pointer; transition: 0.2s; font-weight: 600;
        }
        .primary-btn { background: var(--primary); color: white; width: 100%; }
        .primary-btn:hover { background: var(--primary-hover); }
        #addBtn { background: #e2e8f0; }
    </style>
</head>
<body>

<div class="app">
    <h1>今晚吃什么？</h1>
    
    <div class="wheel-card">
        <div id="result" class="result-display">准备好开转了吗？</div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <button id="spinBtn" class="primary-btn" style="margin-top: 15px;">开始抽奖</button>
    </div>

    <div class="add-card">
        <h3>添加新菜品</h3>
        <div class="input-row">
            <input type="text" id="foodInput" placeholder="比如：麻辣烫">
            <button id="addBtn">添加</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const foodInput = document.getElementById('foodInput');
const addBtn = document.getElementById('addBtn');
const spinBtn = document.getElementById('spinBtn');
const resultDiv = document.getElementById('result');

let foods = ["米饭", "面条", "火锅", "汉堡", "寿司", "猪脚饭"];
let rotation = 0;
let isSpinning = false;

function draw() {
    const n = foods.length;
    const arc = (Math.PI * 2) / n;
    const cx = 200, cy = 200, r = 180;

    ctx.clearRect(0, 0, 400, 400);

    foods.forEach((food, i) => {
        const startAngle = rotation + i * arc;
        const endAngle = rotation + (i + 1) * arc;

        // 扇区颜色交替
        ctx.fillStyle = i % 2 === 0 ? '#60a5fa' : '#93c5fd';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, startAngle, endAngle);
        ctx.fill();
        ctx.strokeStyle = "white";
        ctx.stroke();

        // 绘制文字
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(startAngle + arc / 2);
        ctx.fillStyle = "white";
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(food, r - 20, 5);
        ctx.restore();
    });

    // 绘制中心圆点
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fill();

    // 绘制固定指针 (12点钟方向)
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.moveTo(cx, 10);
    ctx.lineTo(cx - 10, 35);
    ctx.lineTo(cx + 10, 35);
    ctx.closePath();
    ctx.fill();
}

function spin() {
    if (isSpinning) return;
    isSpinning = true;
    resultDiv.textContent = "转动中...";

    // 随机力度：基础速度 + 随机增量
    let velocity = 0.2 + Math.random() * 0.15;
    const friction = 0.985; // 摩擦系数，越接近1转得越久

    function animate() {
        if (velocity > 0.002) {
            rotation += velocity;
            velocity *= friction;
            draw();
            requestAnimationFrame(animate);
        } else {
            isSpinning = false;
            determineResult();
        }
    }
    animate();
}

function determineResult() {
    const n = foods.length;
    const arc = (Math.PI * 2) / n;
    
    // 逻辑：指针在 1.5 * PI (270度) 位置
    // 算出当前旋转偏移量对 2PI 取模
    let offset = (rotation % (Math.PI * 2));
    
    // 计算哪个扇区越过了 1.5 * PI 的那条线
    let index = Math.floor((1.5 * Math.PI - offset) / arc) % n;
    if (index < 0) index += n;

    resultDiv.textContent = `今晚就吃：${foods[index]}！`;
}

addBtn.onclick = () => {
    const val = foodInput.value.trim();
    if (val && !foods.includes(val)) {
        foods.push(val);
        foodInput.value = "";
        draw();
    }
};

spinBtn.onclick = spin;
draw(); // 初始渲染
</script>

</body>
</html>
