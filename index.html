<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚餐转盘</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <div class="wheel-card">
        <h1>今晚吃什么？</h1>
        <div id="result" class="wheel-display">准备好开转了吗？</div>
        
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        
        <button id="spinBtn" class="primary-btn">开始转盘</button>
    </div>

    <div class="add-card">
        <h3>添加新菜品</h3>
        <div class="input-row">
            <input type="text" id="foodInput" placeholder="输入食物名称...">
            <button id="addBtn">添加</button>
        </div>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
